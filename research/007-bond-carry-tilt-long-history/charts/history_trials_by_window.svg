  <g id="qune-title">
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(12.384 26.050922)">Carry alone was ahead of the same-exposure mix in both registered</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(12.384 42.073734)">sub-windows and all three rate eras, but none alone reached t = 2</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(12.384 57.100922)">(highest 1.91); over the whole window adding trend changed little</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(12.384 72.625922)">(+0.86% against +0.85% a year, both t 2.10)</text>
  </g>
  <g id="qune-subtitle">
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 91.475375)">Mean monthly difference to each trial's own B3, annualised (× 12), %, by sub-window (registered) and rate</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 103.475375)">era (by execution month). Carry tilt T1 (accent), carry + trend T2 and trend alone T3 (greys).</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 115.475375)">Descriptive, no decision weight.</text>
  </g>
  <g id="qune-source-line">
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 377.8555)">Source: FRED DGS10, DGS7, DTB3; synthetic 8.5-year par bond and bill legs (Study 002's construction, frozen). Sample Jul 1974 to</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 387.4555)">Dec 2018, 534 monthly holding periods. Qune Research, Study 007. Windows in time order within each group (not ranked); the two</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 397.0555)">groups are two splits of the same 534 months. Whole-window figures: summary.json, attribution. Run once;</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 406.6555)">results/history/summary.json. Verdict: inconclusive (fragile) (section 9.5).</text>
  </g>
