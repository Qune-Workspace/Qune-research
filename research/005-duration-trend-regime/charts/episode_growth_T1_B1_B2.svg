  <g id="qune-title">
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 23.079656)">Over 2019–2026 the conditional rule kept 15% of what the</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 38.551922)">trend exit gained over holding IEF: +7.3% against +27.7% for</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 54.076922)">the trend rule and +3.5% for holding IEF</text>
