  <g id="qune-title">
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 25.042922)">Tracking error rose with IEF's volatility, 0.21 to 0.37 of it</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 40.567922)">in every year, so a fixed 1.5% limit set when volatility was</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 56.092922)">4.6% was breached in 8 of 13 years and on the whole window</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 72.176906)">(2.02%)</text>
  </g>
  <g id="qune-subtitle">
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 90.467375)">Each point is one calendar year of 2003–2015: annualised tracking error of IEF against the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 102.467375)">synthetic bond (vertical) and IEF's realised volatility (horizontal), % p.a. Check A3 is scored</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 115.436125)">on the whole window.</text>
  </g>
  <g id="qune-source-line">
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 359.2315)">Source: Tiingo IEF adjusted close; synthetic bond from FRED yields. Sample 2003-01-02 to 2015-12-31. Qune Research, Study</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 368.72025)">002. Post hoc and descriptive, no decision weight (results/validation/window2/posthoc_by_year.md); the pre-registered</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 378.4315)">check failed on the full-window figure, 2.02% against 1.5%.</text>
  </g>
 </g>
