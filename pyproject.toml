# Repository-wide lint and type-check configuration (BUILD_LOG 2026-10-23).
# No build system: the shared library qune_research/ is imported from the
# repository root (each study's conftest.py and reproduce.sh add it to the path),
# and every study keeps its own pinned requirements.txt.

[tool.ruff]
line-length = 120
target-version = "py312"
# The independent reviewers' scripts are kept exactly as the reviewers wrote them.
extend-exclude = [".venv", "paper-log/raw", "data/raw", "research/*/review_recompute.py"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade, B bugbear.
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length is a formatting choice this code base did not make
# (439 lines over 120 characters at the time of adoption); not enforced.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Study code that produced published results is frozen: only mechanical,
# behaviour-preserving fixes (import order, the datetime.UTC alias, unused
# imports) were applied to it when lint was adopted.  Rules whose fix would
# need a hand edit of that code are suspended under research/ rather than
# edit it; the F rules (real defects) still apply there.
"research/*" = ["B905", "B007", "B023", "E702", "E731", "E741", "UP031"]

[tool.mypy]
python_version = "3.12"
files = ["qune_research"]
exclude = ["qune_research/tests/"]
# statsmodels, scipy and matplotlib ship no stubs that cover the calls made.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
# Bodies of unannotated functions are checked too (adopted 2026-10-23, no
# defects found at the time).
check_untyped_defs = true

# Line coverage of the shared library, `make coverage` and the CI lint job.
# The tests themselves are excluded from the measure.  The CI floor of 90%
# is below the 94.5% measured at adoption (2026-10-23, 904 statements), so it
# catches a drop, not a rounding.
[tool.coverage.run]
source = ["qune_research"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
precision = 1
