# Runs every study's unit tests on push and pull request.  No secrets, no
# vendor data: the tests use constructed series only, and every reproduce
# script refuses to touch returns without an APPROVED file and raw data that
# this workflow never has.  A green badge means the engines and statistics
# behave as specified; it says nothing about any result.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        study:
          - research/001-slope-duration-switch
          - research/002-slope-duration-switch-r
          - research/003-bond-tsmom-ief
          - research/004-xasset-trend-voltarget
          - research/005-duration-trend-regime
          - research/006-term-spread-switch-long-history
          - research/007-bond-carry-tilt-long-history
          - research/008-bond-value-tilt-long-history
          - research/009-pooled-forward-duration-timing
          - research/010-factor-momentum-french-us
          - research/011-industry-momentum-french-us
          - qune_research
          - desk-view
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.study }}/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install --quiet -r "${{ matrix.study }}/requirements.txt"
      - name: Run the study's tests
        working-directory: ${{ matrix.study }}
        run: python -m pytest -q

  # Lint (ruff) over the whole repository and type check (mypy with the pandas
  # and requests stubs) of the shared library, as configured in pyproject.toml.
  # The reviewers' scripts and the data directories are excluded there.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            qune_research/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m pip install --quiet -r qune_research/requirements.txt
      - name: ruff
        run: python -m ruff check .
      - name: mypy (shared library)
        run: python -m mypy
      # Line coverage of the shared library, tests excluded (pyproject.toml).
      # The floor is below the figure measured at adoption so that it catches
      # a drop, not a rounding.
      - name: coverage (shared library, floor 90%)
        working-directory: qune_research
        run: python -m pytest -q --cov=qune_research --cov-config=../pyproject.toml --cov-report=term-missing --cov-fail-under=90

  # The independent reviewers' recomputation of every published statistic in
  # Studies 003 to 006 from the committed result files, then the headline t of
  # Studies 006-008 from their committed monthly files (`make reproduce`).
  # No vendor data, credentials or approval file: rows that need the raw files
  # are reported as "not checked".  The job fails only when a script does not
  # run to its summary line; the last-digit README mismatches disclosed in the
  # 004 and 005 reviews are expected and shown in the log.
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qune_research/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install --quiet -r qune_research/requirements.txt
      - name: make reproduce
        run: make reproduce PYTHON=python
