  <g id="qune-title">
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 23.026922)">BIL tracked the cash-accrual model to within 0.04% a year</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 38.551922)">over 2007 to 2018; only 2007 to 2009 sat outside the ±0.2%</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 55.437469)">band written down beforehand</text>
  </g>
  <g id="qune-subtitle">
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 72.926375)">Annualised mean daily difference, BIL total return minus the bill-yield cash accrual, by calendar</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 84.926375)">year, % p.a. Gate for the full-window mean: ±0.3% (passed at +0.037%).</text>
  </g>
  <g id="qune-source-line">
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 302.7835)">Source: Tiingo BIL adjusted close; FRED DTB3. Sample 2007-06-04 to 2018-12-31. Qune Research, Study 003. Data check D2</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 312.27225)">(section 5.3), not a performance test; results/checks/data_checks.json. Bars in calendar order, not sorted, because the</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 321.9835)">message is the regime pattern.</text>
