  <g id="qune-title">
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 23.026922)">The rebuilt bond matched IEF's return level: a gap of −0.01%</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 38.551922)">a year over 2003–15 and +0.10% over 2016–18, inside the bands</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(11.52 54.076922)">set beforehand; Study 001's bond had missed by +0.45%</text>
  </g>
  <g id="qune-subtitle">
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 72.926375)">Annualised mean daily difference, IEF total return minus the synthetic bond, by calendar year, %</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 84.926375)">p.a. Shaded: each window's pre-registered acceptance band for the window mean (check A4); the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 96.926375)">check is on the mean, not on single years.</text>
  </g>
  <g id="qune-source-line">
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 293.1835)">Source: Synthetic ageing bond from FRED Treasury yields; IEF from Alpaca (2016-18) and Tiingo (2003-15) daily bars. Sample</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(11.52 302.7835)">2003 to 2018. Qune Research, Study 002. Data check A4 (section 5.3), not a performance test; no rule was run.</text>
