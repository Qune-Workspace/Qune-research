  <g id="qune-title">
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(12.384 26.607656)">The value tilt was ahead of the same-exposure mix before 2003</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(12.384 42.079922)">(+1.36% a year) and behind it over 2003–18 (−0.85%), T1a and T1b</text>
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', sans-serif; fill: #1f1f1f" transform="translate(12.384 57.657656)">alike; whole period not supported (t 1.38)</text>
  </g>
  <g id="qune-subtitle">
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 76.454375)">Mean monthly difference to each trial's own B3, annualised (× 12), %, by sub-window (registered) and rate</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 88.454375)">era (by execution month). Value tilt T1 on headline CPI (accent), T1a on core CPI and T1b on a trailing</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 100.454375)">120-month rank (greys), Jul 1974 to Dec 2018 (T1b from Jul 1979). Descriptive, no decision weight.</text>
  </g>
  <g id="qune-source-line">
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 382.3675)">Source: FRED DGS10, DGS7, DTB3, CPIAUCNS (ALFRED release dates); synthetic 8.5-year par bond and bill legs (Study 002's</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 391.9675)">construction, frozen). Sample Jul 1974 to Dec 2018, 534 monthly holding periods (T1b from Jul 1979, 474). Qune Research, Study 008.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 401.5675)">Windows in time order within each group (not ranked); the two groups are two splits of the same months. T1b starts in Jul 1979, so</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 411.1675)">it has fewer months in 1974-07 to 2002-12 (282 against 342), 1974-07 to 1985-12 (78 against 138), 1974-07 to 1981-12 (30 against</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', sans-serif; fill: #6b6b6b" transform="translate(12.384 420.7675)">90). Run once; results/history/summary.json. Verdict: not supported (section 9.5).</text>
  </g>
 </g>
